name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run migrations
        env:
          DJANGO_SECRET_KEY: test-secret
          DJANGO_USE_SQLITE_FOR_TESTS: '1'
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: test-secret
          DJANGO_USE_SQLITE_FOR_TESTS: '1'
        run: python manage.py test --verbosity=2

  # Run the test suite against a real Postgres service to exercise
  # transactional concurrency tests (e.g., the OTP concurrency test).
  test-postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: usovs_db
          POSTGRES_USER: usovs_user
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (include test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Install Postgres client (for pg_isready)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        env:
          PGPASSWORD: password
        run: |
          until pg_isready -h localhost -p 5432 -U usovs_user; do
            echo "Waiting for Postgres..."
            sleep 1
          done

      - name: Run migrations on Postgres
        env:
          DJANGO_SECRET_KEY: test-secret
          POSTGRES_DB: usovs_db
          POSTGRES_USER: usovs_user
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: |
          python manage.py migrate

      - name: Run tests (Postgres backend)
        env:
          DJANGO_SECRET_KEY: test-secret
          POSTGRES_DB: usovs_db
          POSTGRES_USER: usovs_user
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: |
          python manage.py test --verbosity=2

